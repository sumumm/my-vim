# 定时任务配置，由 .cnb.yml 的 include 引入
# 注意：只改本文件不会自动同步定时任务；修改 .cnb.yml 或到「云原生构建 → 定时任务」点同步才会生效
main:
  # 每天 03:30（系统时区 Asia/Shanghai）检查内置组件上游是否有新提交
  # 有更新则同步源码、回写 pack/plugins.tsv、刷新 README，并自动 commit + push
  "crontab: 30 3 * * *":
    - name: sync-bundled-plugins
      stages:
        - name: sync upstream and commit
          script: bash scripts/sync-plugins.sh
